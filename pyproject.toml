[project]
name = "agentbaby"
version = "0.1.0"
description = "志愿领航·高报师 - 高考志愿填报的对话系统（FastAPI + DeepSeek + 三层记忆架构）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "openai==1.59.6",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography==44.0.0",
    "pydantic==2.10.5",
    "python-dotenv==1.0.1",
    "pymilvus>=3.0.0",
    "langfuse>=4.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
